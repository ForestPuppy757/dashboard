<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд трансляций</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0a0e27;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .event-card { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            cursor: pointer;
        }
        .event-card:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(148, 163, 184, 0.3);
            z-index: 10;
        }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }
        .dot-active { background-color: #10b981; box-shadow: 0 0 12px #10b981, 0 0 20px rgba(16, 185, 129, 0.5); }
        .dot-past { background-color: #065f46; box-shadow: 0 0 8px #065f46, 0 0 14px rgba(6, 95, 70, 0.4); }
        .dot-moved { background-color: #ef4444; box-shadow: 0 0 12px #ef4444, 0 0 20px rgba(239, 68, 68, 0.5); }
        .dot-moved-past { background-color: #7f1d1d; box-shadow: 0 0 8px #7f1d1d, 0 0 14px rgba(127, 29, 29, 0.4); }
        .dot-special { background-color: #fbbf24; box-shadow: 0 0 15px #fbbf24, 0 0 25px rgba(251, 191, 36, 0.6); animation: pulse 2s infinite; }
        .dot-special-past { background-color: #92400e; box-shadow: 0 0 8px #92400e, 0 0 14px rgba(146, 64, 14, 0.4); }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        
        .faded-event { opacity: 0.35; }
        .faded-event:hover { opacity: 0.55; }
        .past-event { opacity: 0.7; }
        .past-event:hover { opacity: 0.85; }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .glow-text { text-shadow: 0 0 30px rgba(102, 126, 234, 0.8), 0 0 60px rgba(102, 126, 234, 0.4); }
        .neon-border { box-shadow: 0 0 20px rgba(102, 126, 234, 0.3), inset 0 0 20px rgba(102, 126, 234, 0.1); }

        .custom-select-wrapper { position: relative; width: 240px; min-width: 240px; }
        .custom-select-trigger {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px;
            color: #e2e8f0; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; user-select: none;
            width: 240px; min-width: 240px;
        }
        .custom-select-trigger:hover { border-color: rgba(148, 163, 184, 0.4); background: rgba(30, 41, 59, 0.9); }
        .custom-select-trigger.open {
            border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            border-bottom-left-radius: 0; border-bottom-right-radius: 0;
        }
        .custom-select-trigger .trigger-text { flex: 1; text-align: center; }
        .custom-select-trigger .trigger-arrow {
            width: 16px; height: 16px; color: #94a3b8;
            transition: transform 0.3s ease; flex-shrink: 0;
        }
        .custom-select-trigger.open .trigger-arrow { transform: rotate(180deg); }

        .custom-select-dropdown {
            position: absolute; top: 100%; left: 0;
            width: 240px; min-width: 240px;
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.2); border-top: none;
            border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
            max-height: 320px; overflow-y: auto; z-index: 1000;
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .custom-select-dropdown.open { display: block; animation: slideDown 0.25s ease; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-select-option {
            padding: 10px 16px; color: #e2e8f0; font-size: 14px;
            cursor: pointer; transition: background 0.15s;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            white-space: nowrap;
            text-align: center;
        }
        .custom-select-option:last-child { border-bottom: none; }
        .custom-select-option:hover { background: rgba(102, 126, 234, 0.15); }
        .custom-select-option.selected {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            color: white; font-weight: 600;
        }
        .custom-select-option.year-header {
            color: #a78bfa; font-weight: 700; font-size: 13px; text-align: center;
            padding: 10px 16px 6px; cursor: default; border-bottom: none; letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .custom-select-option.year-header:hover { background: transparent; }
        .custom-select-option.all-years {
            font-weight: 700; font-size: 15px; text-align: center;
            padding: 12px 16px; color: #e2e8f0;
            white-space: nowrap;
        }
        .custom-select-option.all-years:hover { background: rgba(102, 126, 234, 0.15); }

        .custom-select-dropdown::-webkit-scrollbar { width: 6px; }
        .custom-select-dropdown::-webkit-scrollbar-track { background: transparent; }
        .custom-select-dropdown::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }
        .custom-select-dropdown::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

        .updates-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            flex-shrink: 0;
        }
        .updates-btn:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(148, 163, 184, 0.4);
        }
        .updates-btn.active {
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
        }
        .updates-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        .updates-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 380px;
            max-width: 90vw;
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }
        .updates-dropdown.open {
            display: block;
            animation: slideDown 0.25s ease;
        }
        .updates-dropdown-header {
            padding: 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            font-weight: 700;
            font-size: 15px;
            color: #e2e8f0;
        }
        .updates-dropdown-empty {
            padding: 24px 16px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }
        .update-item {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            transition: background 0.15s;
        }
        .update-item:last-child {
            border-bottom: none;
        }
        .update-item:hover {
            background: rgba(102, 126, 234, 0.08);
        }
        .update-type {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 6px;
        }
        .update-type.voice {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .update-type.dub {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .update-type.status {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .update-type.translator {
            background: rgba(168, 85, 247, 0.15);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .update-series {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .update-detail {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }

        .month-title {
            font-size: 1.5rem; font-weight: 700; color: #e2e8f0;
            margin-bottom: 1rem; padding-left: 0.5rem; border-left: 4px solid #667eea;
        }

        .calendar-grid { display: grid; gap: 0.5rem; grid-template-columns: repeat(7, 1fr); }
        @media (max-width: 1024px) { .calendar-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 768px) { .calendar-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 380px) { .calendar-grid { grid-template-columns: 1fr; } }

        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        @media (max-width: 768px) { .calendar-header { display: none; } }

        @media (max-width: 768px) {
            .prev-month-day, .next-month-day { display: none !important; }
        }

        @media (max-width: 768px) {
            .day-cell { min-height: 100px; padding: 0.5rem; }
            .event-card { padding: 0.5rem; }
            .event-title { font-size: 0.75rem; word-wrap: break-word; overflow-wrap: break-word; hyphens: auto; }
            .event-info { font-size: 0.65rem; }
            .empty-day-text { font-size: 0.6rem; }
        }

        .empty-day-icon { opacity: 0.25; transition: opacity 0.3s ease; }
        .empty-day-icon:hover { opacity: 0.45; }
        .empty-day-text { font-size: 0.55rem; color: #94a3b8; text-align: center; line-height: 1.3; opacity: 0.5; font-style: italic; }

        .search-container { position: relative; width: 100%; }
        .search-input-wrapper { position: relative; }
        .search-input {
            width: 100%; padding: 12px 80px 12px 40px;
            background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px; color: #e2e8f0; font-size: 14px; font-family: inherit; transition: all 0.2s;
        }
        .search-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2); }
        .search-input::placeholder { color: #64748b; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; pointer-events: none; }
        .search-clear {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            color: rgba(148, 163, 184, 0.6); cursor: pointer; font-size: 12px; font-weight: 500;
            padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
            display: none; white-space: nowrap;
        }
        .search-clear.visible { display: block; }
        .search-clear:hover { color: #e2e8f0; background: rgba(148, 163, 184, 0.15); }

        .search-dropdown, .filter-list-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-dropdown.active, .filter-list-container.active {
            grid-template-rows: 1fr;
        }
        .search-dropdown > div, .filter-list-container > div {
            overflow: hidden;
            min-height: 0;
        }

        .search-dropdown-inner {
            position: relative;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-top: 8px;
        }

        .search-dropdown-item { padding: 10px 15px; cursor: pointer; font-size: 14px; color: #e2e8f0; border-bottom: 1px solid rgba(148, 163, 184, 0.1); transition: background 0.15s; }
        .search-dropdown-item:last-child { border-bottom: none; }
        .search-dropdown-item:hover { background: rgba(102, 126, 234, 0.2); }
        .search-dropdown-empty { padding: 14px; text-align: center; color: #64748b; font-size: 13px; }

        .search-info-block {
            margin-top: 12px;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .search-info-block.visible { display: block; }
        .search-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 640px) {
            .search-info-grid { grid-template-columns: 1fr; }
        }
        .search-info-card {
            padding: 12px 14px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .search-info-card:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateY(-1px);
        }
        .search-info-card.past { border-left: 3px solid rgba(148, 163, 184, 0.4); }
        .search-info-card.next { border-left: 3px solid #10b981; }
        .search-info-card-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .search-info-card-series {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 2px;
        }
        .search-info-card-meta {
            font-size: 12px;
            color: #94a3b8;
        }
        .search-info-card-date {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 6px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .search-info-card.next .search-info-card-date {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }

        .filter-btn {
            position: relative; display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px;
            color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; white-space: nowrap;
        }
        .filter-btn:hover { background: rgba(30, 41, 59, 0.8); }
        .filter-btn.active { color: white; }
        .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        
        .filter-btn.airing { border-color: rgba(16, 185, 129, 0.3); }
        .filter-btn.airing .filter-dot { background: #10b981; box-shadow: 0 0 10px #10b981, 0 0 18px rgba(16, 185, 129, 0.5); }
        .filter-btn.airing.active { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); color: #6ee7b7; }
        
        .filter-btn.new-season { border-color: rgba(59, 130, 246, 0.3); }
        .filter-btn.new-season .filter-dot { background: #3b82f6; box-shadow: 0 0 10px #3b82f6, 0 0 18px rgba(59, 130, 246, 0.5); }
        .filter-btn.new-season.active { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); color: #93c5fd; }
        
        .filter-btn.ended { border-color: rgba(168, 85, 247, 0.3); }
        .filter-btn.ended .filter-dot { background: #a855f7; box-shadow: 0 0 10px #a855f7, 0 0 18px rgba(168, 85, 247, 0.5); }
        .filter-btn.ended.active { background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.6); box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); color: #d8b4fe; }

        #filter-lists {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .filter-list-container { margin-top: 0; padding-top: 4px; }
        .filter-list-container.active { margin-top: 20px; overflow-y: auto; }
        
        .filter-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px; 
            padding-top: 4px;
        }
        .filter-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 10px;
            cursor: pointer; transition: all 0.2s; gap: 8px;
        }
        .filter-list-item:hover { background: rgba(30, 41, 59, 0.8); transform: translateY(-1px); }
        
        .filter-list-item.border-airing { border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 8px rgba(16, 185, 129, 0.2); }
        .filter-list-item.border-new-season { border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 0 8px rgba(59, 130, 246, 0.2); }
        .filter-list-item.border-ended { border-color: rgba(168, 85, 247, 0.6); box-shadow: 0 0 8px rgba(168, 85, 247, 0.2); }
        .filter-list-item.selected-ended {
            border-color: rgba(168, 85, 247, 0.9) !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            background: rgba(168, 85, 247, 0.15);
        }
        .filter-list-item.selected-new-season {
            border-color: rgba(59, 130, 246, 0.9) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            background: rgba(59, 130, 246, 0.15);
        }
        
        .filter-list-name { font-weight: 600; font-size: 14px; color: #e2e8f0; }
        .filter-list-meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .filter-list-date { font-size: 13px; color: #cbd5e1; font-weight: 500; padding: 4px 10px; background: rgba(102, 126, 234, 0.15); border-radius: 6px; flex-shrink: 0; }
        .filter-list-item:hover .filter-list-date { background: rgba(102, 126, 234, 0.3); }
        .filter-list-empty { text-align: center; padding: 20px; color: #64748b; font-size: 13px; grid-column: 1 / -1; }

        .dimmed-cell { opacity: 0.2; filter: grayscale(0.6); }
        .highlighted-cell {
            border-color: rgba(168, 85, 247, 0.6) !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .highlighted-new-season-cell {
            border-color: rgba(59, 130, 246, 0.6) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .highlighted-event {
            border-color: rgba(168, 85, 247, 0.8) !important;
            background: rgba(168, 85, 247, 0.15) !important;
        }
        .highlighted-new-season-event {
            border-color: rgba(59, 130, 246, 0.8) !important;
            background: rgba(59, 130, 246, 0.15) !important;
        }
        .search-nearest-cell {
            border-color: rgba(16, 185, 129, 0.7) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(16, 185, 129, 0.1);
        }
        .search-nearest-event {
            border-color: rgba(16, 185, 129, 0.8) !important;
            background: rgba(16, 185, 129, 0.15) !important;
        }

        .new-season-empty-msg {
            text-align: center;
            padding: 20px;
            margin-top: 16px;
            border-radius: 12px;
            border: 1px dashed rgba(59, 130, 246, 0.4);
            background: rgba(59, 130, 246, 0.08);
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .new-season-empty-msg.visible { 
            display: block; 
        }

        .novelty-wrapper { position: relative; display: inline-flex; align-items: center; }
        .novelty-tooltip {
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: rgba(251, 191, 36, 0.95); color: #1e1b4b; padding: 6px 12px; border-radius: 8px;
            font-size: 11px; font-weight: 700; white-space: nowrap; pointer-events: none; opacity: 0;
            transition: opacity 0.2s; z-index: 50; box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
        }
        .novelty-tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border: 5px solid transparent; border-top-color: rgba(251, 191, 36, 0.95);
        }
        .novelty-wrapper:hover .novelty-tooltip, .novelty-wrapper.show-tooltip .novelty-tooltip { opacity: 1; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
