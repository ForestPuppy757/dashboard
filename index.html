    <script>
        const CONFIG = {
            csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCGpum3bqWe33FPYcvCEnBkTF6m0v-6A7Hz2zRX91h0xWFUkgA8Kwse7f6X3tMoB3lLQh0tGVahZ1V/pub?output=csv',
            colDate: 'Дата', colSeries: 'Сериал', colSeason: 'Сезон', colEpisode: 'Серия',
            colModerator: 'Модератор', colStatus: 'Статус', colBan: 'Запрет',
            colTranslator: 'Переводчик',
            colVoice: 'Озвучка от AlisaDirilis', colDub: 'Дубляж',
            colMoveReason: 'Причина переноса', colMoveAnswer: 'Ответ для пользователей',
            colUpdated: 'Обновлено'
        };

        let allEvents = [];
        let uniqueSeries = [];
        let availableYears = [];
        let todayUpdates = [];
        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const dayNamesFull = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
        const dayNamesShort = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        const currentMonthIndex = new Date().getMonth();
        const currentYear = new Date().getFullYear();
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let activeFilters = { search: '', airing: false, newSeason: false, ended: false };
        let selectedEndedSeries = null;
        let selectedNewSeasonSeries = null;
        let currentRenderContext = { mode: 'month', year: null, month: null };

        const seriesSearch = document.getElementById('series-search');
        const searchClear = document.getElementById('search-clear');
        const searchDropdown = document.getElementById('search-dropdown');
        const searchDropdownInner = document.getElementById('search-dropdown-inner');
        const searchInfoBlock = document.getElementById('search-info-block');
        const searchInfoGrid = document.getElementById('search-info-grid');
        const newSeasonEmptyMsg = document.getElementById('new-season-empty-msg');
        const monthFilterInput = document.getElementById('month-filter');
        const monthTrigger = document.getElementById('month-trigger');
        const monthTriggerText = document.getElementById('month-trigger-text');
        const monthDropdown = document.getElementById('month-dropdown');
        const updatesBtn = document.getElementById('updates-btn');
        const updatesBadge = document.getElementById('updates-badge');
        const updatesDropdown = document.getElementById('updates-dropdown');
        const updatesList = document.getElementById('updates-list');

        const layoutMap = {
            'q': 'й', 'w': 'ц', 'e': 'у', 'r': 'к', 't': 'е', 'y': 'н', 'u': 'г', 'i': 'ш', 'o': 'щ', 'p': 'з', '[': 'х', ']': 'ъ',
            'a': 'ф', 's': 'ы', 'd': 'в', 'f': 'а', 'g': 'п', 'h': 'р', 'j': 'о', 'k': 'л', 'l': 'д', ';': 'ж', "'": 'э',
            'z': 'я', 'x': 'ч', 'c': 'с', 'v': 'м', 'b': 'и', 'n': 'т', 'm': 'ь', ',': 'б', '.': 'ю', '/': '.',
            'Q': 'Й', 'W': 'Ц', 'E': 'У', 'R': 'К', 'T': 'Е', 'Y': 'Н', 'U': 'Г', 'I': 'Ш', 'O': 'Щ', 'P': 'З', '{': 'Х', '}': 'Ъ',
            'A': 'Ф', 'S': 'Ы', 'D': 'В', 'F': 'А', 'G': 'П', 'H': 'Р', 'J': 'О', 'K': 'Л', 'L': 'Д', ':': 'Ж', '"': 'Э',
            'Z': 'Я', 'X': 'Ч', 'C': 'С', 'V': 'М', 'B': 'И', 'N': 'Т', 'M': 'Ь', '<': 'Б', '>': 'Ю', '?': ','
        };

        function convertLayout(text) {
            return text.split('').map(ch => layoutMap[ch] !== undefined ? layoutMap[ch] : ch).join('');
        }

        // 🔥 НАДЁЖНЫЙ ПАРСЕР ДАТ — пробует все возможные форматы
        function parseDate(dateStr) {
            if (!dateStr) return null;
            
            // Если уже объект Date (PapaParse с dynamicTyping)
            if (dateStr instanceof Date) {
                return isNaN(dateStr.getTime()) ? null : dateStr;
            }
            
            const str = String(dateStr).trim();
            if (!str) return null;
            
            // Формат 1: ДД.ММ.ГГГГ (русский, основной)
            let match = str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (match) {
                const day = parseInt(match[1], 10);
                const month = parseInt(match[2], 10) - 1;
                const year = parseInt(match[3], 10);
                const d = new Date(year, month, day);
                if (d.getFullYear() === year && d.getMonth() === month && d.getDate() === day) return d;
            }
            
            // Формат 2: ДД/ММ/ГГГГ
            match = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (match) {
                const day = parseInt(match[1], 10);
                const month = parseInt(match[2], 10) - 1;
                const year = parseInt(match[3], 10);
                const d = new Date(year, month, day);
                if (d.getFullYear() === year && d.getMonth() === month && d.getDate() === day) return d;
            }
            
            // Формат 3: ГГГГ-ММ-ДД (ISO)
            match = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (match) {
                const year = parseInt(match[1], 10);
                const month = parseInt(match[2], 10) - 1;
                const day = parseInt(match[3], 10);
                const d = new Date(year, month, day);
                if (d.getFullYear() === year && d.getMonth() === month && d.getDate() === day) return d;
            }
            
            // Формат 4: ДД.ММ.ГГ (короткий год) — добавляем 2000
            match = str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2})$/);
            if (match) {
                const day = parseInt(match[1], 10);
                const month = parseInt(match[2], 10) - 1;
                const year = 2000 + parseInt(match[3], 10);
                const d = new Date(year, month, day);
                if (d.getFullYear() === year && d.getMonth() === month && d.getDate() === day) return d;
            }
            
            // Формат 5: ММ/ДД/ГГГГ (американский) — только если первый компонент > 12 (явно день)
            match = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (match) {
                const first = parseInt(match[1], 10);
                const second = parseInt(match[2], 10);
                const year = parseInt(match[3], 10);
                // Если первое число > 12 — это точно день (ДД/ММ), уже обработано выше
                // Если второе число > 12 — это точно день (ММ/ДД)
                if (second > 12) {
                    const month = first - 1;
                    const day = second;
                    const d = new Date(year, month, day);
                    if (d.getFullYear() === year && d.getMonth() === month && d.getDate() === day) return d;
                }
            }
            
            // Fallback: стандартный парсинг
            const d = new Date(str);
            if (!isNaN(d.getTime())) return d;
            
            return null;
        }

        function populateMonthFilter() {
            monthDropdown.innerHTML = '';
            
            const allOption = document.createElement('div');
            allOption.className = 'custom-select-option all-years';
            allOption.dataset.value = 'all';
            allOption.textContent = `${currentYear} год`;
            monthDropdown.appendChild(allOption);
            
            availableYears.forEach(year => {
                const yearHeader = document.createElement('div');
                yearHeader.className = 'custom-select-option year-header';
                yearHeader.textContent = `── ${year} год ──`;
                monthDropdown.appendChild(yearHeader);
                
                monthNames.forEach((name, index) => {
                    const option = document.createElement('div');
                    option.className = 'custom-select-option';
                    option.dataset.value = `${year}-${index}`;
                    option.textContent = `${name} ${year}`;
                    if (year === currentYear && index === currentMonthIndex) {
                        option.classList.add('selected');
                        monthTriggerText.textContent = `${name} ${year}`;
                        monthFilterInput.value = `${year}-${index}`;
                    }
                    monthDropdown.appendChild(option);
                });
            });
            
            monthDropdown.querySelectorAll('.custom-select-option:not(.year-header)').forEach(option => {
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const value = option.dataset.value;
                    monthFilterInput.value = value;
                    monthTriggerText.textContent = option.textContent;
                    
                    monthDropdown.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    
                    closeMonthDropdown();
                    renderView();
                });
            });
        }

        function openMonthDropdown() {
            monthTrigger.classList.add('open');
            monthDropdown.classList.add('open');
        }

        function closeMonthDropdown() {
            monthTrigger.classList.remove('open');
            monthDropdown.classList.remove('open');
        }

        monthTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            if (monthDropdown.classList.contains('open')) closeMonthDropdown();
            else openMonthDropdown();
        });

        updatesBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            updatesDropdown.classList.toggle('open');
            updatesBtn.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-select-wrapper')) closeMonthDropdown();
            if (!e.target.closest('.search-container') && !e.target.closest('.search-dropdown')) closeDropdown();
            if (!e.target.closest('.updates-btn') && !e.target.closest('.updates-dropdown')) {
                updatesDropdown.classList.remove('open');
                updatesBtn.classList.remove('active');
            }
        });

        function openDropdown() { searchDropdown.classList.add('active'); }
        function closeDropdown() { searchDropdown.classList.remove('active'); }

        seriesSearch.addEventListener('input', function() {
            let query = this.value.trim();
            searchClear.classList.toggle('visible', this.value.length > 0);
            
            if (!query) { 
                closeDropdown(); 
                activeFilters.search = '';
                searchInfoBlock.classList.remove('visible');
                renderView(); 
                return; 
            }
            
            const queryLower = query.toLowerCase();
            let matches = uniqueSeries.filter(s => s.toLowerCase().includes(queryLower));
            
            if (matches.length === 0) {
                const converted = convertLayout(query);
                const convertedLower = converted.toLowerCase();
                matches = uniqueSeries.filter(s => s.toLowerCase().includes(convertedLower));
                
                if (matches.length > 0) {
                    this.value = converted;
                }
            }
            
            if (matches.length === 0) {
                searchDropdownInner.innerHTML = '<div class="search-dropdown-empty">Ничего не найдено</div>';
                openDropdown();
                return;
            }
            
            searchDropdownInner.innerHTML = matches.map(s => 
                `<div class="search-dropdown-item" data-series="${escapeHtml(s)}">${escapeHtml(s)}</div>`
            ).join('');
            openDropdown();
            
            searchDropdownInner.querySelectorAll('.search-dropdown-item').forEach(item => {
                item.addEventListener('click', () => {
                    const seriesName = item.dataset.series;
                    seriesSearch.value = seriesName;
                    searchClear.classList.add('visible');
                    activeFilters.search = seriesName;
                    closeDropdown();
                    updateSearchInfo(seriesName);
                    renderView();
                });
            });
        });

        searchClear.addEventListener('click', function(e) {
            e.stopPropagation();
            seriesSearch.value = '';
            searchClear.classList.remove('visible');
            activeFilters.search = '';
            searchInfoBlock.classList.remove('visible');
            closeDropdown();
            renderView();
        });

        seriesSearch.addEventListener('focus', function() {
            if (this.value.trim()) this.dispatchEvent(new Event('input'));
        });

        function findNearestEvent(seriesName) {
            const upcoming = allEvents.filter(e => {
                if (e[CONFIG.colSeries].trim() !== seriesName) return false;
                if (!e._parsedDate || e._parsedDate < today) return false;
                const status = String(e[CONFIG.colStatus] || '').toLowerCase();
                if (status.includes('перенос') || status.includes('перенес')) return false;
                return true;
            }).sort((a, b) => a._parsedDate - b._parsedDate);
            
            if (upcoming.length > 0) return upcoming[0];
            return null;
        }

        function findLastPastEvent(seriesName) {
            const past = allEvents.filter(e => {
                if (e[CONFIG.colSeries].trim() !== seriesName) return false;
                if (!e._parsedDate || e._parsedDate >= today) return false;
                return true;
            }).sort((a, b) => b._parsedDate - a._parsedDate);
            
            return past.length > 0 ? past[0] : null;
        }

        function updateSearchInfo(seriesName) {
            const pastEvent = findLastPastEvent(seriesName);
            const nextEvent = findNearestEvent(seriesName);
            
            if (!pastEvent && !nextEvent) {
                searchInfoBlock.classList.remove('visible');
                return;
            }
            
            let html = '';
            
            if (pastEvent) {
                const season = pastEvent[CONFIG.colSeason] ? pastEvent[CONFIG.colSeason].trim() : '';
                const episode = pastEvent[CONFIG.colEpisode] ? pastEvent[CONFIG.colEpisode].trim() : '';
                let metaText = '';
                if (season && episode) metaText = `Сезон ${season} • Серия ${episode}`;
                else if (season) metaText = `Сезон ${season}`;
                else if (episode) metaText = `Серия ${episode}`;
                
                html += `<div class="search-info-card past" data-date="${formatDateForCell(pastEvent._parsedDate)}" data-series="${escapeHtml(seriesName)}">
                    <div>
                        <div class="search-info-card-label">Прошедшая трансляция</div>
                        <div class="search-info-card-series">${escapeHtml(seriesName)}</div>
                        <div class="search-info-card-meta">${metaText}</div>
                    </div>
                    <div class="search-info-card-date">${formatDateDMY(pastEvent._parsedDate)}</div>
                </div>`;
            } else {
                html += `<div class="search-info-card past" style="opacity: 0.4;">
                    <div>
                        <div class="search-info-card-label">Прошедшая трансляция</div>
                        <div class="search-info-card-series">${escapeHtml(seriesName)}</div>
                        <div class="search-info-card-meta">Нет данных</div>
                    </div>
                    <div class="search-info-card-date">—</div>
                </div>`;
            }
            
            if (nextEvent) {
                const season = nextEvent[CONFIG.colSeason] ? nextEvent[CONFIG.colSeason].trim() : '';
                const episode = nextEvent[CONFIG.colEpisode] ? nextEvent[CONFIG.colEpisode].trim() : '';
                let metaText = '';
                if (season && episode) metaText = `Сезон ${season} • Серия ${episode}`;
                else if (season) metaText = `Сезон ${season}`;
                else if (episode) metaText = `Серия ${episode}`;
                
                html += `<div class="search-info-card next" data-date="${formatDateForCell(nextEvent._parsedDate)}" data-series="${escapeHtml(seriesName)}">
                    <div>
                        <div class="search-info-card-label">Ближайшая трансляция</div>
                        <div class="search-info-card-series">${escapeHtml(seriesName)}</div>
                        <div class="search-info-card-meta">${metaText}</div>
                    </div>
                    <div class="search-info-card-date">${formatDateDMY(nextEvent._parsedDate)}</div>
                </div>`;
            } else {
                html += `<div class="search-info-card next" style="opacity: 0.4;">
                    <div>
                        <div class="search-info-card-label">Ближайшая трансляция</div>
                        <div class="search-info-card-series">${escapeHtml(seriesName)}</div>
                        <div class="search-info-card-meta">Нет данных</div>
                    </div>
                    <div class="search-info-card-date">—</div>
                </div>`;
            }
            
            searchInfoGrid.innerHTML = html;
            searchInfoBlock.classList.add('visible');
            
            searchInfoGrid.querySelectorAll('.search-info-card').forEach(card => {
                card.addEventListener('click', () => {
                    const dateStr = card.dataset.date;
                    const series = card.dataset.series;
                    if (dateStr && series && dateStr !== 'undefined') {
                        scrollToCell(dateStr, series);
                    }
                });
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const filter = this.dataset.filter;
                this.classList.toggle('active');
                activeFilters[filter] = this.classList.contains('active');
                if (!activeFilters.ended) selectedEndedSeries = null;
                if (!activeFilters.newSeason) selectedNewSeasonSeries = null;
                updateFilterLists();
                renderView();
            });
        });

        function getLastStatusBefore(seriesName, beforeDate) {
            const relevant = allEvents.filter(e => e[CONFIG.colSeries].trim() === seriesName && e._parsedDate && e._parsedDate <= beforeDate).sort((a, b) => a._parsedDate - b._parsedDate);
            return relevant.length > 0 ? relevant[relevant.length - 1] : null;
        }

        function isAiringInCurrentMonth(seriesName) {
            const monthStart = new Date(currentYear, currentMonthIndex, 1);
            const monthEnd = new Date(currentYear, currentMonthIndex + 1, 0);
            return allEvents.some(e => {
                if (e[CONFIG.colSeries].trim() !== seriesName || !e._parsedDate) return false;
                if (e._parsedDate < monthStart || e._parsedDate > monthEnd) return false;
                const status = String(e[CONFIG.colStatus] || '').toLowerCase();
                if (status.includes('перенос') || status.includes('перенес')) return false;
                if ((status.includes('финал сезона') || status.includes('финал сериала')) && e._parsedDate < today) return false;
                if (status.includes('в эфире') || status.includes('новинка') || 
                    status.includes('финал сезона') || status.includes('финал сериала')) return true;
                return false;
            });
        }

        function isWaitingNewSeason(seriesName) {
            const lastEvent = getLastStatusBefore(seriesName, today);
            return lastEvent && String(lastEvent[CONFIG.colStatus] || '').toLowerCase().includes('финал сезона');
        }

        function isSeriesEnded(seriesName) {
            const lastEvent = getLastStatusBefore(seriesName, today);
            return lastEvent && String(lastEvent[CONFIG.colStatus] || '').toLowerCase().includes('финал сериала');
        }

        function getAiringList() {
            const result = [];
            uniqueSeries.forEach(seriesName => {
                if (!isAiringInCurrentMonth(seriesName)) return;
                const upcomingEvents = allEvents.filter(e => {
                    if (e[CONFIG.colSeries].trim() !== seriesName || !e._parsedDate) return false;
                    if (e._parsedDate < today) return false; 
                    const status = String(e[CONFIG.colStatus] || '').toLowerCase();
                    if (status.includes('перенос') || status.includes('перенес')) return false;
                    if (status.includes('в эфире') || status.includes('новинка') || 
                        status.includes('финал сезона') || status.includes('финал сериала')) return true;
                    return false;
                }).sort((a, b) => a._parsedDate - b._parsedDate);
                
                if (upcomingEvents.length > 0) {
                    result.push({ series: seriesName, date: upcomingEvents[0]._parsedDate, event: upcomingEvents[0] });
                }
            });
            return result.sort((a, b) => a.date - b.date);
        }

        function getNewSeasonList() {
            const result = [];
            uniqueSeries.forEach(seriesName => {
                if (!isWaitingNewSeason(seriesName)) return;
                const lastEvent = getLastStatusBefore(seriesName, today);
                result.push({ series: seriesName, date: lastEvent._parsedDate, event: lastEvent });
            });
            return result.sort((a, b) => b.date - a.date);
        }

        function getEndedSeriesList() {
            const result = [];
            uniqueSeries.forEach(seriesName => {
                if (!isSeriesEnded(seriesName)) return;
                const lastEvent = getLastStatusBefore(seriesName, today);
                result.push({ series: seriesName, date: lastEvent._parsedDate, event: lastEvent });
            });
            return result.sort((a, b) => b.date - a.date);
        }

        function updateFilterLists() {
            const airingList = document.getElementById('airing-list');
            const newSeasonList = document.getElementById('new-season-list');
            const endedList = document.getElementById('ended-list');
            
            const activeFilterNames = [];
            if (activeFilters.airing) activeFilterNames.push('airing');
            if (activeFilters.newSeason) activeFilterNames.push('new-season');
            if (activeFilters.ended) activeFilterNames.push('ended');
            const multipleFilters = activeFilterNames.length > 1;
            
            if (activeFilters.airing) {
                const items = getAiringList();
                if (items.length > 0) {
                    airingList.innerHTML = `<div><div class="filter-list">${items.map(item => {
                        const borders = multipleFilters ? 'border-airing' : '';
                        const status = String(item.event[CONFIG.colStatus] || '').toLowerCase();
                        let metaText = `Сезон ${item.event[CONFIG.colSeason] || ''} Серия ${item.event[CONFIG.colEpisode] || ''}`;
                        if (status.includes('финал сезона')) metaText = `Финал сезона • ${metaText}`;
                        else if (status.includes('финал сериала')) metaText = `Финал сериала • ${metaText}`;
                        else if (status.includes('новинка')) metaText = `Новинка • ${metaText}`;
                        return `<div class="filter-list-item ${borders}" data-date="${formatDateForCell(item.date)}" data-series="${escapeHtml(item.series)}">
                            <div><div class="filter-list-name">${escapeHtml(item.series)}</div><div class="filter-list-meta">${metaText}</div></div>
                            <div class="filter-list-date">${formatDateDMY(item.date)}</div>
                        </div>`;
                    }).join('')}</div></div>`;
                    airingList.classList.add('active');
                    attachListClickHandlers(airingList);
                } else {
                    airingList.innerHTML = '<div><div class="filter-list-empty">Нет сериалов в эфире в этом месяце</div></div>';
                    airingList.classList.add('active');
                }
            } else { 
                airingList.classList.remove('active'); 
                setTimeout(() => { if (!activeFilters.airing) airingList.innerHTML = ''; }, 400);
            }
            
            const newSeasonItems = getNewSeasonList();
            if (activeFilters.newSeason) {
                if (newSeasonItems.length > 0) {
                    newSeasonList.innerHTML = `<div><div class="filter-list">${newSeasonItems.map(item => {
                        const borders = multipleFilters ? 'border-new-season' : '';
                        return `<div class="filter-list-item ${borders}" data-date="${formatDateForCell(item.date)}" data-series="${escapeHtml(item.series)}">
                            <div><div class="filter-list-name">${escapeHtml(item.series)}</div><div class="filter-list-meta">Финал сезона ${item.event[CONFIG.colSeason] || ''} Серия ${item.event[CONFIG.colEpisode] || ''}</div></div>
                            <div class="filter-list-date">${formatDateDMY(item.date)}</div>
                        </div>`;
                    }).join('')}</div></div>`;
                    newSeasonList.classList.add('active');
                    attachListClickHandlers(newSeasonList);
                    newSeasonEmptyMsg.classList.remove('visible');
                } else {
                    newSeasonList.innerHTML = '';
                    newSeasonList.classList.remove('active');
                    newSeasonEmptyMsg.classList.add('visible');
                }
            } else { 
                newSeasonList.classList.remove('active'); 
                newSeasonEmptyMsg.classList.remove('visible');
                setTimeout(() => { if (!activeFilters.newSeason) newSeasonList.innerHTML = ''; }, 400);
            }
            
            if (activeFilters.ended) {
                const items = getEndedSeriesList();
                let html = '';
                if (items.length > 0) {
                    html = `<div><div class="filter-list">${items.map(item => {
                        const borders = multipleFilters ? 'border-ended' : '';
                        const isSelected = selectedEndedSeries === item.series ? 'selected-ended' : '';
                        return `<div class="filter-list-item ${borders} ${isSelected}" data-date="${formatDateForCell(item.date)}" data-series="${escapeHtml(item.series)}">
                            <div><div class="filter-list-name">${escapeHtml(item.series)}</div><div class="filter-list-meta">Финал сериала • Сезон ${item.event[CONFIG.colSeason] || ''} Серия ${item.event[CONFIG.colEpisode] || ''}</div></div>
                            <div class="filter-list-date">${formatDateDMY(item.date)}</div>
                        </div>`;
                    }).join('')}</div></div>`;
                } else {
                    html = '<div><div class="filter-list-empty">Нет завершённых сериалов</div></div>';
                }
                
                if (selectedEndedSeries) {
                    html += `<div style="text-align: center; padding: 12px; margin-top: 8px;">
                        <button id="reset-ended-selection" style="background: rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.4); color: #d8b4fe; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s;">
                            ✕ Сбросить выбор: ${escapeHtml(selectedEndedSeries)}
                        </button>
                    </div>`;
                }
                
                endedList.innerHTML = html;
                endedList.classList.add('active');
                attachEndedClickHandlers(endedList);
                
                const resetBtn = document.getElementById('reset-ended-selection');
                if (resetBtn) {
                    resetBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectedEndedSeries = null;
                        updateFilterLists();
                        renderView();
                    });
                }
            } else { 
                endedList.classList.remove('active'); 
                setTimeout(() => { if (!activeFilters.ended) endedList.innerHTML = ''; }, 400);
            }
        }

        function attachListClickHandlers(container) {
            container.querySelectorAll('.filter-list-item').forEach(item => {
                item.addEventListener('click', () => scrollToCell(item.dataset.date, item.dataset.series));
            });
        }

        function attachEndedClickHandlers(container) {
            container.querySelectorAll('.filter-list-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const seriesName = item.dataset.series;
                    const dateStr = item.dataset.date;
                    
                    if (selectedEndedSeries === seriesName) {
                        selectedEndedSeries = null;
                    } else {
                        selectedEndedSeries = seriesName;
                    }
                    
                    updateFilterLists();
                    renderView();
                    setTimeout(() => scrollToCell(dateStr, seriesName), 100);
                });
            });
        }

        function formatDateDMY(date) {
            if (!date) return '';
            return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()}`;
        }
        function formatDateForCell(date) { return formatDateDMY(date); }

        function scrollToCell(dateStr, seriesName) {
            const parts = dateStr.split('.');
            if (parts.length !== 3) return;
            const day = parseInt(parts[0]), month = parseInt(parts[1]) - 1, year = parseInt(parts[2]);
            const filterValue = `${year}-${month}`;
            if (monthFilterInput.value !== filterValue) {
                monthFilterInput.value = filterValue;
                const option = monthDropdown.querySelector(`[data-value="${filterValue}"]`);
                if (option) monthTriggerText.textContent = option.textContent;
                renderView();
                setTimeout(() => highlightCell(day, seriesName), 150);
            } else {
                highlightCell(day, seriesName);
            }
        }

        function highlightCell(day, seriesName) {
            document.querySelectorAll('.day-cell').forEach(cell => {
                const dayNum = cell.querySelector('.text-sm.font-bold');
                if (dayNum && parseInt(dayNum.textContent) === day) {
                    cell.querySelectorAll('.event-card').forEach(card => {
                        const title = card.querySelector('.event-title');
                        if (title && title.textContent.trim() === seriesName) {
                            cell.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                            cell.style.transition = 'all 0.5s ease';
                            cell.style.boxShadow = '0 0 40px rgba(102, 126, 234, 0.8)';
                            setTimeout(() => { cell.style.boxShadow = ''; }, 2500);
                        }
                    });
                }
            });
        }

        function matchesActiveFilters(seriesName) {
            const hasAnyFilter = activeFilters.search || activeFilters.airing || activeFilters.newSeason || activeFilters.ended;
            if (!hasAnyFilter) return true;
            
            if (activeFilters.ended && !activeFilters.search) return true;
            if (activeFilters.newSeason && !activeFilters.search) return true;
            
            if (activeFilters.search && seriesName !== activeFilters.search) return false;
            if (activeFilters.airing || activeFilters.newSeason || activeFilters.ended) {
                let matches = false;
                if (activeFilters.airing && isAiringInCurrentMonth(seriesName)) matches = true;
                if (activeFilters.newSeason && isWaitingNewSeason(seriesName)) matches = true;
                if (activeFilters.ended && isSeriesEnded(seriesName)) matches = true;
                if (!matches) return false;
            }
            return true;
        }

        function getTodayUpdates() {
            const updates = [];
            
            allEvents.forEach(event => {
                const updatedStr = event[CONFIG.colUpdated] ? String(event[CONFIG.colUpdated]).trim() : '';
                if (!updatedStr) return;
                
                const updatedDate = parseDate(updatedStr);
                if (!updatedDate || updatedDate.getTime() !== today.getTime()) return;
                
                const series = event[CONFIG.colSeries].trim();
                const season = event[CONFIG.colSeason] ? event[CONFIG.colSeason].trim() : '';
                const episode = event[CONFIG.colEpisode] ? event[CONFIG.colEpisode].trim() : '';
                const voice = event[CONFIG.colVoice] ? String(event[CONFIG.colVoice]).trim() : '';
                const dub = event[CONFIG.colDub] ? String(event[CONFIG.colDub]).trim() : '';
                const translator = event[CONFIG.colTranslator] ? event[CONFIG.colTranslator].trim() : '';
                const status = event[CONFIG.colStatus] ? event[CONFIG.colStatus].trim() : '';
                
                if (voice && voice !== 'ожидаем' && voice !== '') {
                    updates.push({
                        type: 'voice',
                        series: series,
                        detail: `Вышла озвучка от AlisaDirilis — Сезон ${season} Серия ${episode}`,
                        date: updatedStr
                    });
                }
                
                if (dub && dub !== 'ожидаем' && dub.toLowerCase() !== 'не будет' && dub !== '') {
                    updates.push({
                        type: 'dub',
                        series: series,
                        detail: `Вышел дубляж — Сезон ${season} Серия ${episode}`,
                        date: updatedStr
                    });
                }
                
                const statusLower = status.toLowerCase();
                if (statusLower.includes('перенос') || statusLower.includes('перенес')) {
                    updates.push({
                        type: 'status',
                        series: series,
                        detail: `Статус изменён на "Перенос" — Сезон ${season} Серия ${episode}`,
                        date: updatedStr
                    });
                }
                
                if (translator && translator !== 'Не назначен' && translator !== '') {
                    updates.push({
                        type: 'translator',
                        series: series,
                        detail: `Переводчик: ${translator} — Сезон ${season} Серия ${episode}`,
                        date: updatedStr
                    });
                }
            });
            
            return updates;
        }

        function renderUpdates() {
            todayUpdates = getTodayUpdates();
            
            if (todayUpdates.length > 0) {
                updatesBadge.textContent = todayUpdates.length;
                updatesBadge.style.display = 'block';
            } else {
                updatesBadge.style.display = 'none';
            }
            
            if (todayUpdates.length === 0) {
                updatesList.innerHTML = '<div class="updates-dropdown-empty">Сегодня обновлений не было</div>';
                return;
            }
            
            const typeLabels = {
                voice: 'Озвучка',
                dub: 'Дубляж',
                status: 'Статус',
                translator: 'Переводчик'
            };
            
            updatesList.innerHTML = todayUpdates.map(update => `
                <div class="update-item">
                    <span class="update-type ${update.type}">${typeLabels[update.type]}</span>
                    <div class="update-series">${escapeHtml(update.series)}</div>
                    <div class="update-detail">${escapeHtml(update.detail)}</div>
                </div>
            `).join('');
        }

        Papa.parse(CONFIG.csvUrl, {
            download: true, 
            header: true, 
            skipEmptyLines: true,
            dynamicTyping: false, // 🔥 ВАЖНО: не парсить даты автоматически
            complete: function(results) {
                console.log('=== ОТЛАДКА ЗАГРУЗКИ CSV ===');
                console.log('CSV загружен, строк:', results.data.length);
                console.log('Заголовки:', results.meta.fields);
                
                // 🔥 ПОКАЗЫВАЕМ ПЕРВЫЕ 5 СЫРЫХ ЗНАЧЕНИЙ ДАТ
                if (results.data.length > 0) {
                    console.log('=== ПЕРВЫЕ 5 СТРОК (сырые даты) ===');
                    for (let i = 0; i < Math.min(5, results.data.length); i++) {
                        console.log(`Строка ${i}:`, {
                            rawDate: results.data[i][CONFIG.colDate],
                            type: typeof results.data[i][CONFIG.colDate],
                            series: results.data[i][CONFIG.colSeries]
                        });
                    }
                }
                
                let parsedCount = 0;
                let failedCount = 0;
                const failedSamples = [];
                
                allEvents = results.data
                    .filter(row => row[CONFIG.colDate] && row[CONFIG.colSeries])
                    .map(row => {
                        const rawDate = row[CONFIG.colDate];
                        const d = parseDate(rawDate);
                        if (d) {
                            parsedCount++;
                        } else {
                            failedCount++;
                            if (failedSamples.length < 10) {
                                failedSamples.push({ raw: rawDate, series: row[CONFIG.colSeries] });
                            }
                        }
                        return { ...row, _parsedDate: d };
                    })
                    .filter(row => row._parsedDate !== null)
                    .sort((a, b) => (a._parsedDate || 0) - (b._parsedDate || 0));
                
                console.log(`✅ Успешно распарсено: ${parsedCount}`);
                console.log(`❌ Ошибок парсинга: ${failedCount}`);
                if (failedSamples.length > 0) {
                    console.log('Примеры ошибочных дат:', failedSamples);
                }
                console.log('Событий после фильтрации:', allEvents.length);
                
                const seriesSet = new Set(), yearsSet = new Set();
                allEvents.forEach(event => { 
                    const name = event[CONFIG.colSeries].trim(); 
                    if (name) seriesSet.add(name);
                    if (event._parsedDate) yearsSet.add(event._parsedDate.getFullYear());
                });
                uniqueSeries = Array.from(seriesSet).sort();
                availableYears = Array.from(yearsSet).sort();
                
                console.log('Уникальных сериалов:', uniqueSeries);
                console.log('Доступные годы:', availableYears);
                
                populateMonthFilter();
                renderUpdates();
                renderView();
                setTimeout(() => scrollToToday(), 300);
            },
            error: function(err) {
                console.error("Ошибка загрузки CSV:", err);
                document.getElementById('calendar-wrapper').innerHTML = `<div class="p-8 text-center text-red-400 bg-red-500/10 rounded-2xl border border-red-500/20">Ошибка загрузки расписания. Проверьте ссылку CSV и доступ к таблице.</div>`;
            }
        });

        function parseFilterValue(value) {
            if (value === 'all') return { mode: 'all', year: null, month: null };
            const parts = value.split('-');
            return parts.length === 2 ? { mode: 'month', year: parseInt(parts[0]), month: parseInt(parts[1]) } : { mode: 'all', year: null, month: null };
        }

        function scrollToToday() {
            const todayCell = document.getElementById('today-cell');
            if (todayCell && !activeFilters.ended) {
                todayCell.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                todayCell.style.transition = 'all 0.5s ease';
                todayCell.style.boxShadow = '0 0 30px rgba(102, 126, 234, 0.6)';
                setTimeout(() => { todayCell.style.boxShadow = ''; }, 2000);
            }
        }

        function renderView() {
            const wrapper = document.getElementById('calendar-wrapper');
            wrapper.innerHTML = '';
            const filter = parseFilterValue(monthFilterInput.value);
            
            if (filter.mode === 'all') {
                currentRenderContext = { mode: 'year', year: null, month: null };
                
                const monthsWithEvents = new Set();
                allEvents.forEach(event => {
                    if (!event._parsedDate || !matchesActiveFilters(event[CONFIG.colSeries].trim())) return;
                    monthsWithEvents.add(`${event._parsedDate.getFullYear()}-${event._parsedDate.getMonth()}`);
                });
                
                if (monthsWithEvents.size === 0) {
                    wrapper.innerHTML = '<div class="text-center text-slate-400 py-12">Нет событий по выбранным фильтрам</div>';
                    return;
                }
                
                Array.from(monthsWithEvents).sort((a, b) => {
                    const [ya, ma] = a.split('-').map(Number);
                    const [yb, mb] = b.split('-').map(Number);
                    return ya - yb || ma - mb;
                }).forEach(key => {
                    const [year, month] = key.split('-').map(Number);
                    wrapper.appendChild(createMonthBlock(year, month));
                });
            } else {
                currentRenderContext = { mode: 'month', year: filter.year, month: filter.month };
                wrapper.appendChild(createMonthBlock(filter.year, filter.month));
            }
        }

        function createMonthBlock(year, monthIndex) {
            const wrapper = document.createElement('div');
            wrapper.className = 'mb-8 last:mb-0';
            const title = document.createElement('div');
            title.className = 'month-title';
            title.textContent = `${monthNames[monthIndex]} ${year}`;
            wrapper.appendChild(title);

            const header = document.createElement('div');
            header.className = 'calendar-header';
            dayNamesFull.forEach((name, idx) => {
                const dayEl = document.createElement('div');
                dayEl.className = `text-center text-sm font-bold py-2 ${idx >= 5 ? 'text-purple-400' : 'text-slate-400'}`;
                dayEl.textContent = name;
                header.appendChild(dayEl);
            });
            wrapper.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'calendar-grid';
            wrapper.appendChild(grid);
            renderMonthGrid(grid, year, monthIndex);
            return wrapper;
        }

        function getEmptyDayIcon() {
            return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 md:w-12 md:h-12 mx-auto mb-1">
                <path d="M22 14C22 12 23.5 10 25 10C26.5 10 27 11.5 27 13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <path d="M30 12C30 10 31.5 8 33 8C34.5 8 35 9.5 35 11" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <path d="M38 14C38 12 39.5 10 41 10C42.5 10 43 11.5 43 13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <path d="M12 24H44V40C44 48 38 54 30 54H26C18 54 12 48 12 40V24Z" fill="#1e293b" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
                <path d="M44 28H48C52 28 54 30 54 34C54 38 52 40 48 40H44" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M27 36L24 33C22.5 31.5 22.5 29 24 27.5C25.5 26 27.5 26 29 27.5L30 28.5L31 27.5C32.5 26 34.5 26 36 27.5C37.5 29 37.5 31.5 36 33L33 36L30 39.5L27 36Z" fill="#ef4444" opacity="0.8"/>
            </svg>`;
        }

        function renderMonthGrid(grid, year, monthIndex) {
            grid.innerHTML = '';
            const firstDay = new Date(year, monthIndex, 1);
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            let startDayOfWeek = firstDay.getDay();
            startDayOfWeek = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

            const useAllEvents = activeFilters.ended || activeFilters.newSeason;
            const eventsByMonthDay = {};
            
            allEvents.forEach(event => {
                const d = event._parsedDate;
                if (d && d.getMonth() === monthIndex && d.getFullYear() === year) {
                    if (useAllEvents || matchesActiveFilters(event[CONFIG.colSeries].trim())) {
                        const day = d.getDate();
                        if (!eventsByMonthDay[day]) eventsByMonthDay[day] = [];
                        eventsByMonthDay[day].push(event);
                    }
                }
            });

            const isCurrentMonth = today.getMonth() === monthIndex && today.getFullYear() === year;
            const todayDate = today.getDate();

            if (startDayOfWeek > 0) {
                const prevMonth = monthIndex === 0 ? 11 : monthIndex - 1;
                const prevYear = monthIndex === 0 ? year - 1 : year;
                const daysInPrevMonth = new Date(prevYear, prevMonth + 1, 0).getDate();
                for (let i = startDayOfWeek - 1; i >= 0; i--) {
                    const day = daysInPrevMonth - i;
                    const cell = document.createElement('div');
                    cell.className = 'day-cell prev-month-day bg-slate-900/30 min-h-[120px] p-2 flex flex-col rounded-xl border border-slate-700/20 dimmed-cell';
                    const dateObj = new Date(prevYear, prevMonth, day);
                    const dayOfWeek = dateObj.getDay();
                    const dayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
                    const isWeekend = dayIndex >= 5;
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'flex items-baseline justify-between mb-2';
                    const isMobile = window.innerWidth < 768;
                    const dayName = isMobile ? dayNamesShort[dayIndex] : '';
                    dayHeader.innerHTML = `${dayName ? `<span class="text-xs font-bold ${isWeekend ? 'text-purple-400/70' : 'text-slate-500'}">${dayName}</span>` : '<span></span>'}<span class="text-sm font-bold text-slate-600">${day}</span>`;
                    cell.appendChild(dayHeader);
                    
                    const dayEvents = allEvents.filter(e => {
                        const d = e._parsedDate;
                        return d && d.getFullYear() === prevYear && d.getMonth() === prevMonth && d.getDate() === day && matchesActiveFilters(e[CONFIG.colSeries].trim());
                    });
                    
                    if (activeFilters.airing) {
                        cell.classList.add('dimmed-cell');
                    }
                    
                    applyCellHighlighting(cell, dayEvents, dateObj, true);
                    grid.appendChild(cell);
                }
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, monthIndex, day);
                const isToday = isCurrentMonth && day === todayDate;
                const dayOfWeek = dateObj.getDay();
                const dayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
                const isWeekend = dayIndex >= 5;

                const isTodayHighlight = isToday && !activeFilters.ended;
                
                let cellClasses = `day-cell bg-slate-800/40 min-h-[120px] p-2 flex flex-col relative transition-all rounded-xl border border-slate-700/30 hover:bg-slate-800/60`;
                if (isTodayHighlight) cellClasses += ' neon-border border-purple-500/50';
                
                const cell = document.createElement('div');
                cell.className = cellClasses;
                if (isToday && !activeFilters.ended) cell.id = 'today-cell';
                
                const dayHeader = document.createElement('div');
                dayHeader.className = 'flex items-baseline justify-between mb-2';
                const isMobile = window.innerWidth < 768;
                const dayName = isMobile ? dayNamesShort[dayIndex] : '';
                dayHeader.innerHTML = `${dayName ? `<span class="text-xs font-bold ${isTodayHighlight ? 'text-purple-400' : (isWeekend ? 'text-purple-400/70' : 'text-slate-500')}">${dayName}</span>` : '<span></span>'}<span class="text-sm font-bold ${isTodayHighlight ? 'text-purple-400' : 'text-slate-300'}">${day}</span>`;
                cell.appendChild(dayHeader);

                let dayEvents = eventsByMonthDay[day] || [];
                
                const isPastDay = dateObj < today;
                
                if (activeFilters.airing && isPastDay) {
                    cell.classList.add('dimmed-cell');
                }
                
                applyCellHighlighting(cell, dayEvents, dateObj, false);
                grid.appendChild(cell);
            }

            const totalCells = startDayOfWeek + daysInMonth;
            const remainingCells = 7 - (totalCells % 7);
            if (remainingCells < 7) {
                const nextMonth = monthIndex === 11 ? 0 : monthIndex + 1;
                const nextYear = monthIndex === 11 ? year + 1 : year;
                for (let i = 0; i < remainingCells; i++) {
                    const day = i + 1;
                    const cell = document.createElement('div');
                    cell.className = 'day-cell next-month-day bg-slate-900/30 min-h-[120px] p-2 flex flex-col rounded-xl border border-slate-700/20 dimmed-cell';
                    const dateObj = new Date(nextYear, nextMonth, day);
                    const dayOfWeek = dateObj.getDay();
                    const dayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
                    const isWeekend = dayIndex >= 5;
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'flex items-baseline justify-between mb-2';
                    const isMobile = window.innerWidth < 768;
                    const dayName = isMobile ? dayNamesShort[dayIndex] : '';
                    dayHeader.innerHTML = `${dayName ? `<span class="text-xs font-bold ${isWeekend ? 'text-purple-400/70' : 'text-slate-500'}">${dayName}</span>` : '<span></span>'}<span class="text-sm font-bold text-slate-600">${day}</span>`;
                    cell.appendChild(dayHeader);
                    
                    const dayEvents = allEvents.filter(e => {
                        const d = e._parsedDate;
                        return d && d.getFullYear() === nextYear && d.getMonth() === nextMonth && d.getDate() === day && matchesActiveFilters(e[CONFIG.colSeries].trim());
                    });
                    
                    applyCellHighlighting(cell, dayEvents, dateObj, false);
                    grid.appendChild(cell);
                }
            }
        }

        function applyCellHighlighting(cell, dayEvents, dateObj, isPrevMonth) {
            const isPastDay = dateObj < today;
            
            if (activeFilters.search) {
                const searchSeries = activeFilters.search;
                const nearestEvent = findNearestEvent(searchSeries);
                const hasSearchSeries = dayEvents.some(e => e[CONFIG.colSeries].trim() === searchSeries);
                const isNearestCell = nearestEvent && nearestEvent._parsedDate && 
                    nearestEvent._parsedDate.getDate() === dateObj.getDate() &&
                    nearestEvent._parsedDate.getMonth() === dateObj.getMonth() &&
                    nearestEvent._parsedDate.getFullYear() === dateObj.getFullYear();
                
                if (isNearestCell) {
                    cell.classList.add('search-nearest-cell');
                    cell.classList.remove('hover:bg-slate-800/60');
                    dayEvents.forEach(event => {
                        if (event[CONFIG.colSeries].trim() === searchSeries) {
                            cell.appendChild(createEventElement(event, false, false, true, false));
                        } else {
                            cell.appendChild(createEventElement(event, true, false, false, false));
                        }
                    });
                } else if (hasSearchSeries) {
                    dayEvents.forEach(event => {
                        if (event[CONFIG.colSeries].trim() === searchSeries) {
                            cell.appendChild(createEventElement(event, false, false, false, false));
                        } else {
                            cell.appendChild(createEventElement(event, true, false, false, false));
                        }
                    });
                } else if (dayEvents.length > 0) {
                    cell.classList.add('dimmed-cell');
                    dayEvents.forEach(event => cell.appendChild(createEventElement(event, true, false, false, false)));
                } else {
                    cell.classList.add('dimmed-cell');
                    if (!isPrevMonth) {
                        const emptyBlock = document.createElement('div');
                        emptyBlock.className = 'empty-day-icon flex flex-col items-center justify-center flex-1 mt-1';
                        emptyBlock.innerHTML = `${getEmptyDayIcon()}<div class="empty-day-text">Сегодня без<br>турецких сериалов</div>`;
                        cell.appendChild(emptyBlock);
                    }
                }
            } else if (activeFilters.newSeason && selectedNewSeasonSeries) {
                const hasSelectedNewSeason = dayEvents.some(e => {
                    if (e[CONFIG.colSeries].trim() !== selectedNewSeasonSeries) return false;
                    const status = String(e[CONFIG.colStatus] || '').toLowerCase();
                    return status.includes('финал сезона') || status.includes('в эфире');
                });
                
                if (hasSelectedNewSeason) {
                    cell.classList.add('highlighted-new-season-cell');
                    cell.classList.remove('hover:bg-slate-800/60');
                    dayEvents.forEach(event => {
                        const status = String(event[CONFIG.colStatus] || '').toLowerCase();
                        if (event[CONFIG.colSeries].trim() === selectedNewSeasonSeries && 
                            (status.includes('финал сезона') || status.includes('в эфире'))) {
                            cell.appendChild(createEventElement(event, false, false, false, true));
                        } else {
                            cell.appendChild(createEventElement(event, true, false, false, false));
                        }
                    });
                } else {
                    cell.classList.add('dimmed-cell');
                    if (dayEvents.length > 0) {
                        dayEvents.forEach(event => cell.appendChild(createEventElement(event, true, false, false, false)));
                    } else if (!isPrevMonth) {
                        const emptyBlock = document.createElement('div');
                        emptyBlock.className = 'empty-day-icon flex flex-col items-center justify-center flex-1 mt-1';
                        emptyBlock.innerHTML = `${getEmptyDayIcon()}<div class="empty-day-text">Сегодня без<br>турецких сериалов</div>`;
                        cell.appendChild(emptyBlock);
                    }
                }
            } else if (activeFilters.ended) {
                const hasEndedSeries = dayEvents.some(e => {
                    const status = String(e[CONFIG.colStatus] || '').toLowerCase();
                    return status.includes('финал сериала');
                });
                
                if (selectedEndedSeries) {
                    const hasSelectedEnded = dayEvents.some(e => {
                        const status = String(e[CONFIG.colStatus] || '').toLowerCase();
                        return e[CONFIG.colSeries].trim() === selectedEndedSeries && status.includes('финал сериала');
                    });
                    
                    if (hasSelectedEnded) {
                        cell.classList.add('highlighted-cell');
                        cell.classList.remove('hover:bg-slate-800/60');
                        dayEvents.forEach(event => {
                            const status = String(event[CONFIG.colStatus] || '').toLowerCase();
                            if (event[CONFIG.colSeries].trim() === selectedEndedSeries && status.includes('финал сериала')) {
                                cell.appendChild(createEventElement(event, false, true, false, false));
                            } else {
                                cell.appendChild(createEventElement(event, true, false, false, false));
                            }
                        });
                    } else {
                        cell.classList.add('dimmed-cell');
                        if (dayEvents.length > 0) {
                            dayEvents.forEach(event => cell.appendChild(createEventElement(event, true, false, false, false)));
                        } else if (!isPrevMonth) {
                            const emptyBlock = document.createElement('div');
                            emptyBlock.className = 'empty-day-icon flex flex-col items-center justify-center flex-1 mt-1';
                            emptyBlock.innerHTML = `${getEmptyDayIcon()}<div class="empty-day-text">Сегодня без<br>турецких сериалов</div>`;
                            cell.appendChild(emptyBlock);
                        }
                    }
                } else {
                    if (hasEndedSeries) {
                        cell.classList.add('highlighted-cell');
                        cell.classList.remove('hover:bg-slate-800/60');
                        dayEvents.forEach(event => {
                            const status = String(event[CONFIG.colStatus] || '').toLowerCase();
                            if (status.includes('финал сериала')) {
                                cell.appendChild(createEventElement(event, false, true, false, false));
                            } else {
                                cell.appendChild(createEventElement(event, true, false, false, false));
                            }
                        });
                    } else {
                        cell.classList.add('dimmed-cell');
                        if (dayEvents.length > 0) {
                            dayEvents.forEach(event => cell.appendChild(createEventElement(event, true, false, false, false)));
                        } else if (!isPrevMonth) {
                            const emptyBlock = document.createElement('div');
                            emptyBlock.className = 'empty-day-icon flex flex-col items-center justify-center flex-1 mt-1';
                            emptyBlock.innerHTML = `${getEmptyDayIcon()}<div class="empty-day-text">Сегодня без<br>турецких сериалов</div>`;
                            cell.appendChild(emptyBlock);
                        }
                    }
                }
            } else {
                if (dayEvents.length > 0) {
                    dayEvents.forEach(event => {
                        const isEndedHighlight = activeFilters.ended && isSeriesEnded(event[CONFIG.colSeries].trim());
                        cell.appendChild(createEventElement(event, false, isEndedHighlight, false, false));
                    });
                } else {
                    const emptyBlock = document.createElement('div');
                    emptyBlock.className = 'empty-day-icon flex flex-col items-center justify-center flex-1 mt-1';
                    emptyBlock.innerHTML = `${getEmptyDayIcon()}<div class="empty-day-text">Сегодня без<br>турецких сериалов</div>`;
                    cell.appendChild(emptyBlock);
                }
            }
        }

        const noveltyFirstClick = new Set();

        function createEventElement(event, isFaded, isEndedHighlight, isSearchHighlight, isNewSeasonHighlight) {
            const statusRaw = (event[CONFIG.colStatus] || '').trim().toLowerCase();
            let dotClass = 'dot-active', isMoved = false, isSpecial = false, specialText = '';
            let bgClass = 'bg-slate-800/60 border-slate-600/30 hover:bg-slate-800/80';

            const eventDate = event._parsedDate;
            const isPast = eventDate && eventDate < today;
            
            const isDeepFaded = isFaded;
            const isLightFaded = isPast && !isFaded;
            
            if (statusRaw.includes('финал сезона') || statusRaw.includes('финал сериала') || statusRaw.includes('новинка')) {
                isSpecial = true;
                specialText = statusRaw;
                bgClass = 'bg-yellow-500/10 border-yellow-500/30 hover:bg-yellow-500/20';
                if (isDeepFaded || isLightFaded) dotClass = 'dot-special-past';
                else dotClass = 'dot-special';
            } else if (statusRaw.includes('перенес') || statusRaw.includes('перенос') || statusRaw.includes('измен')) {
                isMoved = true;
                bgClass = 'bg-red-500/10 border-red-500/30 hover:bg-red-500/20';
                if (isDeepFaded || isLightFaded) dotClass = 'dot-moved-past';
                else dotClass = 'dot-moved';
            } else {
                if (isDeepFaded || isLightFaded) dotClass = 'dot-past';
                else dotClass = 'dot-active';
            }

            const eventEl = document.createElement('div');
            let extraClasses = '';
            if (isDeepFaded) extraClasses += ' faded-event';
            else if (isLightFaded) extraClasses += ' past-event';
            if (isEndedHighlight) extraClasses += ' highlighted-event';
            if (isSearchHighlight) extraClasses += ' search-nearest-event';
            if (isNewSeasonHighlight) extraClasses += ' highlighted-new-season-event';
            
            eventEl.className = `event-card text-xs p-2 rounded-xl border mb-1.5 ${bgClass} ${extraClasses}`;
            
            const isNovelty = isSpecial && specialText.includes('новинка');
            const noveltyKey = `${event[CONFIG.colSeries]}-${formatDateDMY(eventDate)}`;
            
            let html = `<div class="flex items-center mb-1 gap-1">`;
            if (isNovelty) {
                html += `<div class="novelty-wrapper" data-novelty-key="${noveltyKey}">
                    <span class="status-dot ${dotClass}"></span>
                    <div class="novelty-tooltip">Смотрим без подписки</div>
                    <span class="font-bold text-slate-200 event-title flex-1" style="word-wrap: break-word; overflow-wrap: break-word;" title="${escapeHtml(event[CONFIG.colSeries])}">${escapeHtml(event[CONFIG.colSeries])}</span>
                </div>`;
            } else {
                html += `<span class="status-dot ${dotClass}"></span>
                    <span class="font-bold text-slate-200 event-title flex-1" style="word-wrap: break-word; overflow-wrap: break-word;" title="${escapeHtml(event[CONFIG.colSeries])}">${escapeHtml(event[CONFIG.colSeries])}</span>`;
            }
            html += `</div>`;
            
            const season = event[CONFIG.colSeason] ? event[CONFIG.colSeason].trim() : '';
            const episode = event[CONFIG.colEpisode] ? event[CONFIG.colEpisode].trim() : '';
            let seasonEpisodeDisplay = '';
            if (season && episode) seasonEpisodeDisplay = `Сезон ${season} Серия ${episode}`;
            else if (season) seasonEpisodeDisplay = `Сезон ${season}`;
            else if (episode) seasonEpisodeDisplay = `Серия ${episode}`;
            
            const mod = event[CONFIG.colModerator] ? event[CONFIG.colModerator].trim() : 'Не назначен';
            const banText = event[CONFIG.colBan] ? event[CONFIG.colBan].trim() : '';
            const hasBan = banText && banText !== '-';

            if (seasonEpisodeDisplay) html += `<div class="text-[10px] text-slate-500 mb-0.5 font-medium event-info">${seasonEpisodeDisplay}</div>`;
            html += `<div class="text-[10px] text-slate-400 event-info" style="word-wrap: break-word;">Модератор: ${mod}</div>`;
            if (isMoved) html += `<div class="text-[10px] text-red-400 font-bold mt-0.5">Перенос</div>`;
            if (isSpecial && specialText) html += `<div class="text-[10px] text-yellow-400 font-bold mt-0.5 capitalize">${specialText}</div>`;
            if (hasBan) html += `<div class="text-[10px] text-red-400 mt-1 font-semibold flex items-center bg-red-500/10 border border-red-500/30 px-1.5 py-1 rounded-lg w-fit" style="word-wrap: break-word;"><svg class="w-3 h-3 mr-1 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg> ${escapeHtml(banText)}</div>`;

            eventEl.innerHTML = html;
            
            if (isNovelty) {
                eventEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isMobile = window.innerWidth < 768;
                    if (isMobile) {
                        if (!noveltyFirstClick.has(noveltyKey)) {
                            const wrapper = eventEl.querySelector('.novelty-wrapper');
                            if (wrapper) {
                                wrapper.classList.add('show-tooltip');
                                noveltyFirstClick.add(noveltyKey);
                                setTimeout(() => {
                                    wrapper.classList.remove('show-tooltip');
                                    noveltyFirstClick.delete(noveltyKey);
                                }, 2000);
                            }
                        } else {
                            noveltyFirstClick.delete(noveltyKey);
                            openModal(event);
                        }
                    } else {
                        openModal(event);
                    }
                });
            } else {
                eventEl.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    openModal(event); 
                });
            }
            
            return eventEl;
        }

        const modalOverlay = document.getElementById('modal-overlay');
        const flipCard = document.getElementById('flip-card');
        const flipContainer = document.querySelector('.flip-container');

        function formatDateWithDay(dateStr) {
            if (!dateStr) return '—';
            const d = parseDate(dateStr.toString().trim());
            if (!d) return dateStr;
            return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')} (${d.toLocaleDateString('ru-RU', { weekday: 'long' })})`;
        }

        function openModal(event) {
            closeDropdown();
            const statusRaw = (event[CONFIG.colStatus] || '').trim().toLowerCase();
            let isMoved = false;
            if (statusRaw.includes('перенес') || statusRaw.includes('перенос') || statusRaw.includes('измен')) isMoved = true;

            const backContent = document.getElementById('modal-back-content');
            backContent.innerHTML = '';
            const rows = [];

            if (isMoved) {
                const reason = event[CONFIG.colMoveReason] ? event[CONFIG.colMoveReason].trim() : '';
                const answer = event[CONFIG.colMoveAnswer] ? event[CONFIG.colMoveAnswer].trim() : '';
                if (reason) rows.push({ label: '📋 Причина переноса', value: reason });
                if (answer) rows.push({ label: '💬 Ответ для пользователей', value: answer, isQuote: true });
            } else {
                const translator = event[CONFIG.colTranslator] ? event[CONFIG.colTranslator].trim() : '';
                if (translator) rows.push({ label: '🌐 Переводчик', value: translator });
                
                const voice = event[CONFIG.colVoice] ? event[CONFIG.colVoice].trim() : '';
                const dub = event[CONFIG.colDub] ? event[CONFIG.colDub].trim() : '';
                let voiceValue = 'ожидаем';
                if (voice) voiceValue = formatDateWithDay(voice);
                rows.push({ label: '🎙️ Озвучка от AlisaDirilis', value: voiceValue });
                let dubValue = 'ожидаем';
                if (dub) {
                    const dubLower = dub.toLowerCase();
                    if (dubLower.includes('не будет')) dubValue = 'Не будет';
                    else dubValue = formatDateWithDay(dub);
                }
                rows.push({ label: '🎤 Дубляж', value: dubValue });
            }

            rows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'info-row';
                if (row.isQuote) {
                    rowEl.innerHTML = `<div class="info-label">${row.label}</div><div class="quote-box" data-copy-text="${escapeHtml(row.value)}"><div class="quote-text">${escapeHtml(row.value)}</div><div class="copy-hint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg><span class="copy-hint-text">Нажмите, чтобы скопировать</span></div></div>`;
                } else {
                    rowEl.innerHTML = `<div class="info-label">${row.label}</div><div class="info-value">${escapeHtml(row.value)}</div>`;
                }
                backContent.appendChild(rowEl);
            });

            backContent.querySelectorAll('.quote-box').forEach(box => {
                box.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const text = box.getAttribute('data-copy-text');
                    try {
                        await navigator.clipboard.writeText(text);
                        box.classList.add('copied');
                        const hint = box.querySelector('.copy-hint-text');
                        if (hint) hint.textContent = '✓ Скопировано!';
                        const hintContainer = box.querySelector('.copy-hint');
                        if (hintContainer) hintContainer.classList.add('copied');
                        setTimeout(() => {
                            box.classList.remove('copied');
                            if (hint) hint.textContent = 'Нажмите, чтобы скопировать';
                            if (hintContainer) hintContainer.classList.remove('copied');
                        }, 2000);
                    } catch (err) {
                        const textarea = document.createElement('textarea');
                        textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
                        document.body.appendChild(textarea); textarea.select();
                        try {
                            document.execCommand('copy');
                            box.classList.add('copied');
                            const hint = box.querySelector('.copy-hint-text');
                            if (hint) hint.textContent = '✓ Скопировано!';
                            setTimeout(() => { box.classList.remove('copied'); if (hint) hint.textContent = 'Нажмите, чтобы скопировать'; }, 2000);
                        } catch (e2) { console.error('Не удалось скопировать', e2); }
                        document.body.removeChild(textarea);
                    }
                });
            });

            setTimeout(() => {
                const backFace = document.querySelector('.flip-back');
                const contentHeight = backFace.scrollHeight;
                const minHeight = Math.max(200, contentHeight + 60);
                flipContainer.style.height = `${minHeight}px`;
                flipCard.style.height = `${minHeight}px`;
            }, 10);

            flipCard.classList.remove('flipped');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => flipCard.classList.add('flipped'), 50);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                flipCard.classList.remove('flipped');
                setTimeout(() => { flipContainer.style.height = ''; flipCard.style.height = ''; }, 300);
            }, 300);
        }

        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });

        function escapeHtml(text) { 
            if (!text) return ''; 
            const div = document.createElement('div'); 
            div.textContent = text; 
            return div.innerHTML; 
        }
    </script>
</body>
</html>
